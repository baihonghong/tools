<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36位ID生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .id-display {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
        }
        .id-value {
            font-family: 'Courier New', monospace;
            font-size: 1.4em;
            color: #764ba2;
            word-break: break-all;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .id-length {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            flex: 1;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .info {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 30px;
            border-radius: 5px;
        }
        .info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .info ul {
            margin-left: 20px;
            color: #555;
        }
        .info li {
            margin: 5px 0;
        }
        .api-info {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        .api-info h3 {
            color: #ff9800;
            margin-bottom: 10px;
        }
        .api-info code {
            background: #fff;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.9em;
            display: block;
            margin: 8px 0;
            overflow-x: auto;
        }
        .batch-section {
            margin-top: 20px;
            display: none;
        }
        .batch-input {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .batch-input input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
        }
        .batch-input button {
            flex: 0 0 auto;
            padding: 10px 25px;
        }
        .batch-results {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .batch-results .id-item {
            padding: 8px;
            margin: 5px 0;
            background: white;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 36位ID生成器</h1>
        <p class="subtitle">基于时间戳的全局唯一ID生成服务</p>

        <div class="id-display">
            <div class="id-value" id="idValue">点击按钮生成ID</div>
            <div class="id-length" id="idLength"></div>
        </div>

        <div class="btn-group">
            <button onclick="generateId()">生成新ID</button>
            <button class="secondary" onclick="toggleBatch()">批量生成</button>
        </div>

        <div class="batch-section" id="batchSection">
            <div class="batch-input">
                <input type="number" id="batchCount" placeholder="数量（1-1000）" value="10" min="1" max="1000">
                <button onclick="generateBatch()">批量生成</button>
            </div>
            <div class="batch-results" id="batchResults"></div>
        </div>

        <div class="info">
            <h3>✨ 特性</h3>
            <ul>
                <li>✅ 基于时间戳，有序递增</li>
                <li>✅ 36位字符串长度</li>
                <li>✅ 全局唯一，无冲突</li>
                <li>✅ 支持分布式环境（机器ID）</li>
                <li>✅ 高性能：单机每秒400万+</li>
            </ul>
        </div>

        <div class="api-info">
            <h3>🔗 API接口</h3>
            <p><strong>单个ID：</strong></p>
            <code>GET http://localhost:8080/generate</code>
            <p><strong>批量ID：</strong></p>
            <code>GET http://localhost:8080/generateBatch?count=10</code>
        </div>
    </div>

    <script>
        function generateId() {
            fetch('/generate')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('idValue').textContent = data.id;
                    document.getElementById('idLength').textContent = '长度: ' + data.length + ' 字符 | 时间戳: ' + data.timestamp;
                })
                .catch(error => {
                    document.getElementById('idValue').textContent = '生成失败: ' + error;
                    document.getElementById('idLength').textContent = '';
                });
        }

        function toggleBatch() {
            const section = document.getElementById('batchSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        function generateBatch() {
            const count = document.getElementById('batchCount').value;
            fetch('/generateBatch?count=' + count)
                .then(response => response.json())
                .then(data => {
                    const results = document.getElementById('batchResults');
                    results.innerHTML = '<strong>生成 ' + data.count + ' 个ID：</strong>';
                    data.ids.forEach((id, index) => {
                        results.innerHTML += '<div class="id-item">' + (index + 1) + '. ' + id + '</div>';
                    });
                })
                .catch(error => {
                    alert('生成失败: ' + error);
                });
        }

        // 页面加载时自动生成一个ID
        window.onload = generateId;
    </script>
</body>
</html>
